server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container liveness endpoint, kept out of the game's own paths.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The shell and the code are served un-cached. The entire build is 3 files with no
  # build step, so a stale cached game.js is the only way to play an old version; on a
  # dev host a re-deploy has to be visible on the next refresh. Cache hits are free here
  # because the payload is tiny and static.
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ =404;
  }

  location = / {
    add_header Cache-Control "no-store" always;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 512;
  location ~* \.(js|css|svg)$ {
    add_header Cache-Control "no-store" always;
    gzip on;
  }
}
