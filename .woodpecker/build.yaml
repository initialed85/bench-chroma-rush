# Build, publish, and deploy CHROMA RUSH.
#
# Step 1 builds on beefcake-ci-1's *own* dockerd (`DOCKER_HOST=tcp://docker-beefcake-ci-1:2375`):
# the daemon is published over TCP by the `expose-docker-api-for-woodpecker` spec in home-ops
# `clusters/dev/_deployed/deployed.yaml`, and named by the `docker-beefcake-ci-1` Service in the
# woodpecker namespace. A step is a pod, so it has no docker socket of its own; on the node the
# image lands in the daemon's store, which is `/var/lib/containerd` on Docker 29, and that store is
# the cache — the nginx base is pulled once per node and this repo's layers come back `CACHED`.
# Pinning one node per repo (not a Service balancing over all four CI nodes) is what keeps it warm.
#
# Step 2 is the deploy, and it is a plugin: the script lives in home-ops at
# `ci/woodpecker/plugins/kustomize-deploy/plugin.sh` (contract, traps and dry-run pod in the README next
# to it) and is published as `initialed85/wp-kustomize-deploy` by home-ops' own pipeline. It clones
# home-ops, runs `kustomize edit set image` on this app's kustomization, verifies the tree renders and
# that the rendered tree actually references the tag, commits that one file, and pushes through a retry
# loop. Argo CD's auto-sync then does the rollout. The tag is the commit sha, which is as immutable as a
# digest: rollback is `git revert` of the commit the plugin makes.
#
# Credentials are native Kubernetes Secrets in the woodpecker namespace, mapped to env vars below
# (`WOODPECKER_BACKEND_K8S_ALLOW_NATIVE_SECRETS=true` on the agent). A deploy key answers for one
# repository, so a hijacked pipeline can write manifests to home-ops and nothing else:
#   - `dockerhub`            Docker Hub user + PAT, push target
#   - `home-ops-deploy-key`  ed25519 GitHub deploy key, write, home-ops repo only
steps:
  - name: build-and-push
    image: docker.io/library/docker:cli
    privileged: true
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
      IMAGE: docker.io/initialed85/chroma-rush
    backend_options:
      kubernetes:
        secrets:
          - name: dockerhub
            key: username
            target:
              env: DOCKERHUB_USER
          - name: dockerhub
            key: token
            target:
              env: DOCKERHUB_TOKEN
    commands:
      - docker info --format 'daemon={{.Name}} root={{.DockerRootDir}} images_before={{.Images}}'
      - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
      - docker build -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest" .
      - docker push "$IMAGE:$CI_COMMIT_SHA"
      - docker push "$IMAGE:latest"
      - docker inspect --format 'digest={{.RepoDigests}}' "$IMAGE:$CI_COMMIT_SHA"
      - docker system df

  - name: deploy-home-ops
    # A step counts as a plugin when it has no `commands`, no `entrypoint` and no `environment`
    # (pipeline/frontend/yaml/types/container.go:IsPlugin), which is why the configuration below is
    # `settings:` only. `settings:` values are passed through verbatim: Woodpecker does not expand
    # `$CI_COMMIT_SHA` there (compiler/settings/params.go), so the plugin derives the tag from the step
    # environment itself — `image` is the name as home-ops spells it, and `dir` is what it edits.
    # Pin `:latest` to follow home-ops master, or `:<sha>` for a frozen plugin (both are published).
    image: docker.io/initialed85/wp-kustomize-deploy:latest
    depends_on:
      - build-and-push
    settings:
      image: docker.io/initialed85/chroma-rush
      dir: clusters/dev/applications/chroma-rush
    backend_options:
      kubernetes:
        secrets:
          # The env name IS the plugin setting (PLUGIN_<KEY>), so this mapping is the whole contract.
          - name: home-ops-deploy-key
            key: id_ed25519
            target:
              env: PLUGIN_DEPLOY_KEY
          - name: home-ops-deploy-key
            key: known_hosts
            target:
              env: PLUGIN_KNOWN_HOSTS

when:
  branch: master
  event: push
